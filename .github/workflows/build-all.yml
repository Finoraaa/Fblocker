name: Multi-Platform Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # LINUX BUILD (.deb, .AppImage, .tar.gz)
  # ==========================================
  build-linux:
    name: Linux (.deb & .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2 file wget

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Debian (.deb)
        run: |
          mkdir -p dist
          ./packaging/linux/build-deb.sh 1.0.0

      - name: Package AppImage (.AppImage)
        run: ./packaging/linux/build-appimage.sh

      - name: Package Tarball (.tar.gz)
        run: |
          tar -czvf dist/fblocker-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fblocker-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  # ==========================================
  # ANDROID BUILD (.apk)
  # ==========================================
  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Android Dist
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Fblocker.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fblocker-android
          path: dist/Fblocker.apk

  # ==========================================
  # WINDOWS BUILD (.exe & .zip)
  # ==========================================
  build-windows:
    name: Windows (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          # Compress portable release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Fblocker-windows-x64.zip -Force

          # Build Inno Setup Installer
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\fblocker.iss
          } else {
            Write-Host "Inno Setup not in default path, installing via choco..."
            choco install innosetup -y
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\fblocker.iss
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fblocker-windows
          path: |
            dist/*.zip
            dist/*.exe

  # ==========================================
  # MACOS BUILD (.dmg & .zip)
  # ==========================================
  build-macos:
    name: macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS DMG & Zip
        run: |
          mkdir -p dist
          APP_PATH="build/macos/Build/Products/Release/Finora Fblocker.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" | head -n 1)
          fi

          # Create DMG
          hdiutil create -volname "Finora Fblocker" -srcfolder "$APP_PATH" -ov -format UDZO dist/Fblocker-macOS.dmg

          # Create Zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Fblocker-macOS.zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fblocker-macos
          path: |
            dist/*.dmg
            dist/*.zip

  # ==========================================
  # IOS BUILD (unsigned .ipa)
  # ==========================================
  build-ios:
    name: iOS (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Payload IPA
        run: |
          mkdir -p dist
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r dist/Fblocker-iOS-unsigned.ipa Payload
          zip -r dist/Fblocker-iOS-Runner.app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fblocker-ios
          path: |
            dist/*.ipa
            dist/*.zip
