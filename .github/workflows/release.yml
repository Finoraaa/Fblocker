name: Release Finora Fblocker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ==========================================
  # LINUX RELEASE
  # ==========================================
  release-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2 wget
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package DEB & AppImage
        run: |
          mkdir -p dist
          ./packaging/linux/build-deb.sh 1.0.0
          mkdir -p build
          wget -q -O build/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage"
          chmod +x build/appimagetool
          ./packaging/linux/build-appimage.sh
          tar -czvf dist/Fblocker-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  # ==========================================
  # ANDROID RELEASE
  # ==========================================
  release-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Fblocker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/Fblocker.apk

  # ==========================================
  # WINDOWS RELEASE
  # ==========================================
  release-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Fblocker-windows-x64.zip -Force
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\fblocker.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  # ==========================================
  # MACOS RELEASE
  # ==========================================
  release-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS
        run: |
          mkdir -p dist
          APP_PATH="build/macos/Build/Products/Release/Finora Fblocker.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" | head -n 1)
          fi
          hdiutil create -volname "Finora Fblocker" -srcfolder "$APP_PATH" -ov -format UDZO dist/Fblocker-macOS.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Fblocker-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  # ==========================================
  # IOS RELEASE
  # ==========================================
  release-ios:
    name: Build iOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package iOS
        run: |
          mkdir -p dist
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r dist/Fblocker-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*

  # ==========================================
  # PUBLISH GITHUB RELEASE
  # ==========================================
  publish:
    name: Publish GitHub Release
    needs: [release-linux, release-android, release-windows, release-macos, release-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Finora Fblocker ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ## 🛡️ Finora Fblocker - Ultra Fast Cyber Ad & Tracker Blocker
            
            Finora Fblocker resmi sürümü. Tüm işletim sistemleri için optimize edilmiş ve derlenmiştir.

            ### 📦 İndirilebilir Paketler:
            - **Windows**: `Fblocker-Setup.exe` (Kurulum Sihirbazı) veya `Fblocker-windows-x64.zip` (Taşınabilir)
            - **Android**: `Fblocker.apk`
            - **Linux**: `fblocker-linux-amd64.deb` (Debian/Ubuntu) veya `Fblocker-linux-x86_64.AppImage` (Evrensel Linux)
            - **macOS**: `Fblocker-macOS.dmg` / `Fblocker-macOS.zip`
            - **iOS**: `Fblocker-iOS-unsigned.ipa` (TrollStore / AltStore / Sideloadly)

            ### ✨ Özellikler:
            - 🖤 Modern Siyah-Gri-Beyaz-Kırmızı Finora Siber Arayüzü
            - 🛡️ Tek dokunuşla akıllı kalkan aktivasyonu
            - 📊 Gerçek zamanlı reklam, izleyici ve tasarruf edilen veri sayaçları
            - 📋 Canlı trafik denetleme günlüğü ve anında beyaz/kara liste ekleme
            - 🌐 Dahili Finora Master Core, EasyList ve AdGuard kural veritabanları
            - ⚡ DNS-over-HTTPS (DoH) desteği
